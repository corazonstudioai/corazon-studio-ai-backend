name: Temporary controlled video test
run-name: Temporary controlled video test (${{ inputs.mode }})

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Deploy only the test function, generate once, or remove the function
        type: choice
        options: [deploy, generate, cleanup]
        required: true
      confirmation:
        description: Exact authorization for the selected mode
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-supabase-edge-production
  cancel-in-progress: false

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch and separate authorization
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/codex/video-test-temporary ]] || exit 1
          case "$MODE" in
            deploy) expected='autorizo el despliegue de la función temporal' ;;
            generate) expected='autorizado' ;;
            cleanup) expected='autorizo eliminar la función temporal' ;;
            *) exit 1 ;;
          esac
          if [[ "$CONFIRMATION" != "$expected" ]]; then
            echo '::error::Authorization does not match the selected mode.'
            exit 1
          fi

  deploy:
    if: inputs.mode == 'deploy'
    needs: confirm
    runs-on: ubuntu-latest
    environment: supabase-production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: |
          deno test supabase/functions/video-test-once/index_test.ts
          deno check supabase/functions/video-test-once/index.ts
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Publish only the protected temporary function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: wtfkhpwymdqbskrwecps
          VIDEO_TEST_USER_ID: ${{ secrets.VIDEO_TEST_USER_ID }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          if ! [[ "$VIDEO_TEST_USER_ID" =~ ^[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}$ ]]; then
            echo '::error::Missing or invalid technical account ID.'
            exit 1
          fi
          sed -i "s/__VIDEO_TEST_USER_ID__/$VIDEO_TEST_USER_ID/" supabase/functions/video-test-once/index.ts
          supabase functions deploy video-test-once --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes

  generate:
    if: inputs.mode == 'generate'
    needs: confirm
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: supabase-production
    permissions:
      contents: write
    steps:
      - name: Make one generation call and verify the resulting MP4
        env:
          SUPABASE_PROJECT_REF: wtfkhpwymdqbskrwecps
          VIDEO_TEST_ACCESS_TOKEN: ${{ secrets.VIDEO_TEST_ACCESS_TOKEN }}
          TEST_PERMIT_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -z "$VIDEO_TEST_ACCESS_TOKEN" ]]; then
            echo '::error::Missing session for the technical account.'
            exit 1
          fi
          for command in ffmpeg ffprobe jq; do command -v "$command" >/dev/null; done
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          url="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/video-test-once"
          call() {
            local code
            code="$(curl --silent --show-error --max-time 100 -o "$work/response" -w '%{http_code}'               -H "Authorization: Bearer $VIDEO_TEST_ACCESS_TOKEN"               -H 'Content-Type: application/json' "$@" "$url")"
            if [[ "$code" != 200 ]]; then
              printf 'Function returned HTTP %s\n' "$code" >&2
              jq -r '.error // .code // "unexpected_response" | select(type == "string" and test("^[a-zA-Z0-9_]{1,100}$"))' "$work/response" >&2 || true
              return 1
            fi
          }
          call -H "x-test-github-token: $TEST_PERMIT_TOKEN" --data '{"action":"start"}'
          jq -er '.audio_base64' "$work/response" | base64 --decode > "$work/voice.wav"
          poll="$(jq -ce '{action:"status",queue,signature}' "$work/response")"
          for attempt in $(seq 1 60); do
            call --data "$poll"
            state="$(jq -er '.state' "$work/response")"
            if [[ "$state" == complete ]]; then break; fi
            [[ "$state" == pending ]]
            sleep 6
          done
          if [[ "$state" != complete ]]; then
            echo '::error::fal_queue_timeout'
            exit 1
          fi
          media_url="$(jq -er '.video_url' "$work/response")"
          curl --fail --silent --show-error --proto '=https' --max-time 60 --max-filesize 50000000             --output "$work/video.mp4" "$media_url"
          ffprobe -v error -show_streams -show_format -of json "$work/video.mp4" |
            jq -e 'any(.streams[]; .codec_type == "video" and .height == 480)
              and ((.format.duration | tonumber) >= 3 and (.format.duration | tonumber) <= 6)' >/dev/null
          ffmpeg -nostdin -v error -i "$work/video.mp4" -i "$work/voice.wav"             -map 0:v:0 -map 1:a:0 -vf 'fps=24,tpad=stop_mode=clone:stop_duration=5'             -af 'apad' -t 5 -c:v libx264 -pix_fmt yuv420p -c:a aac -movflags +faststart "$work/result.mp4"
          ffprobe -v error -show_streams -show_format -of json "$work/result.mp4" |
            jq -e 'any(.streams[]; .codec_type == "video" and .height == 480)
              and any(.streams[]; .codec_type == "audio")
              and ((.format.duration | tonumber) == 5)' >/dev/null
          ffmpeg -nostdin -hide_banner -i "$work/result.mp4" -vn -af volumedetect -f null -             2>"$work/volume.txt"
          python -c 'import re,sys; m=re.search(r"max_volume: (-?\d+(?:\.\d+)?) dB",open(sys.argv[1]).read()); assert m and float(m[1]) > -50, "voice_missing_or_silent"' "$work/volume.txt"
          mkdir -p result
          mv "$work/result.mp4" result/corazon-prueba.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: corazon-prueba-narrada
          path: result/corazon-prueba.mp4
          if-no-files-found: error
          retention-days: 7

  cleanup:
    if: always() && needs.confirm.result == 'success' && (inputs.mode == 'cleanup' || inputs.mode == 'generate')
    needs: [confirm, generate]
    runs-on: ubuntu-latest
    environment: supabase-production
    steps:
      - name: Delete only the temporary test function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: wtfkhpwymdqbskrwecps
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          code="$(curl --silent --show-error --output /dev/null --max-time 45 -w '%{http_code}'             --request DELETE -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/functions/video-test-once")"
          case "$code" in
            200|204) echo 'Temporary function removed.' ;;
            404) echo 'Temporary function already absent.' ;;
            *) printf '::error::Temporary function cleanup failed (HTTP %s).\n' "$code"; exit 1 ;;
          esac
