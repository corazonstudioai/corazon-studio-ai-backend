name: Deploy only Supabase video functions
run-name: Supabase video only (${{ inputs.mode }})

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Deploy the reviewed video code or restore the last verified release
        type: choice
        options: [deploy, rollback]
        required: true
      confirmation:
        description: 'Type: autorizo el despliegue limitado'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-supabase-edge-production
  cancel-in-progress: false

jobs:
  check-request:
    runs-on: ubuntu-latest
    steps:
      - name: Require the dedicated branch and explicit confirmation
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/codex/deploy-video-only ||
                "$CONFIRMATION" != "autorizo el despliegue limitado" ]]; then
            echo "::error::Select codex/deploy-video-only and confirm the limited deployment."
            exit 1
          fi
          case "$REQUESTED_MODE" in
            deploy|rollback) ;;
            *) echo "::error::Invalid mode."; exit 1 ;;
          esac

  deploy-video:
    needs: check-request
    runs-on: ubuntu-latest
    environment: supabase-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.mode == 'rollback' && '73ae34fc9e171697781137d3466a23aa02ea2236' || 'd08f48cfadf2c84b10bb4966be164199f462605f' }}
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check the selected video code
        run: |
          deno test supabase/functions/_shared/video_test.ts
          deno check supabase/functions/video-start/index.ts supabase/functions/video-status/index.ts

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy video-status and video-start only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: wtfkhpwymdqbskrwecps
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          supabase functions deploy video-status --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes
          supabase functions deploy video-start --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes
