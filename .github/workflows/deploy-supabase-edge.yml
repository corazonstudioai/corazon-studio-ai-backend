name: Deploy Supabase Edge

on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase-edge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-supabase-edge-production
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: wtfkhpwymdqbskrwecps
      FAL_KEY: ${{ secrets.FAL_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test Edge Functions
        run: |
          deno test supabase/functions/_shared/video_test.ts supabase/functions/_shared/ai_test.ts
          deno check \
            supabase/functions/health/index.ts \
            supabase/functions/chat/index.ts \
            supabase/functions/image/index.ts \
            supabase/functions/tts/index.ts \
            supabase/functions/video-start/index.ts \
            supabase/functions/video-status/index.ts

      - name: Verify deployment credential
        run: test -n "$SUPABASE_ACCESS_TOKEN"

      - name: Apply database migrations
        shell: bash
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            payload="$(jq -n --rawfile query "$migration" '{query: $query, read_only: false}')"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --header "Content-Type: application/json" \
              --data "$payload" \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              >/dev/null
          done

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Synchronize provider secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FAL_KEY"
          test -n "$OPENAI_API_KEY"
          supabase secrets set FAL_KEY="$FAL_KEY" OPENAI_API_KEY="$OPENAI_API_KEY" --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Functions
        run: |
          supabase functions deploy health --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
          supabase functions deploy chat --project-ref "$SUPABASE_PROJECT_REF" --use-api
          supabase functions deploy image --project-ref "$SUPABASE_PROJECT_REF" --use-api
          supabase functions deploy tts --project-ref "$SUPABASE_PROJECT_REF" --use-api
          supabase functions deploy video-start --project-ref "$SUPABASE_PROJECT_REF" --use-api
          supabase functions deploy video-status --project-ref "$SUPABASE_PROJECT_REF" --use-api
