name: Brain real-provider acceptance (manual, two credits)
on:
  push:
    branches: [architecture/supabase-edge-video]
    paths: [.github/workflows/video-e2e-once.yml]
permissions:
  contents: read
concurrency:
  group: video-e2e-test
  cancel-in-progress: false
jobs:
  brain-e2e:
    environment: supabase-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: wtfkhpwymdqbskrwecps
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Create protected temporary technical helper
        shell: bash
        run: |
          set -euo pipefail
          helper="brain-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "HELPER_NAME=$helper" >> "$GITHUB_ENV"
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "HELPER_TOKEN=$token" >> "$GITHUB_ENV"
          mkdir -p "supabase/functions/$helper"
          cat > "supabase/functions/$helper/index.ts" <<'DENO'
          import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
          const key = "TOKEN_PLACEHOLDER";
          const prefix = "brain-e2e-RUN_PLACEHOLDER-";
          const respond = (body: unknown, status = 200) => new Response(JSON.stringify(body), {status,headers:{"content-type":"application/json"}});
          Deno.serve(async request => {
            if (request.headers.get("x-test-key") !== key) return respond({error:"forbidden"},403);
            const url=Deno.env.get("SUPABASE_URL")!;
            const service=createClient(url,Deno.env.get("SUPABASE_SERVICE_ROLE_KEY")!);
            const body=await request.json().catch(()=>({}));
            if(body.action==="create"){
              const email=prefix+crypto.randomUUID()+"@example.invalid";
              const password=crypto.randomUUID()+"Aa1!";
              const created=await service.auth.admin.createUser({email,password,email_confirm:true});
              if(created.error||!created.data.user)return respond({error:"create_failed"},500);
              const id=created.data.user.id;
              const account=await service.from("billing_accounts").insert({user_id:id,identity_kind:"email",free_credits_used:3});
              if(account.error){await service.auth.admin.deleteUser(id);return respond({error:"account_failed"},500);}
              const client=createClient(url,Deno.env.get("SUPABASE_ANON_KEY")!);
              const signed=await client.auth.signInWithPassword({email,password});
              if(signed.error||!signed.data.session){await service.auth.admin.deleteUser(id);return respond({error:"signin_failed"},500);}
              return respond({user_id:id,access_token:signed.data.session.access_token});
            }
            if(typeof body.user_id!=="string")return respond({error:"invalid_user"},400);
            const user=await service.auth.admin.getUserById(body.user_id);
            if(user.error||!user.data.user.email?.startsWith(prefix)||!user.data.user.email.endsWith("@example.invalid"))return respond({error:"forbidden_user"},403);
            if(body.action==="verify"){
              const account=await service.from("billing_accounts").select("free_credits_total,free_credits_used").eq("user_id",body.user_id).single();
              const events=await service.from("generation_events").select("status,credits_charged,engine").eq("user_id",body.user_id);
              if(account.error||events.error)return respond({error:"verify_failed"},500);
              return respond({account:account.data,events:events.data});
            }
            if(body.action==="cleanup"){
              const deleted=await service.auth.admin.deleteUser(body.user_id);
              return deleted.error?respond({error:"cleanup_failed"},500):respond({cleaned:true});
            }
            return respond({error:"invalid_action"},400);
          });
          DENO
          export E2E_TOKEN="$token"
          export E2E_HELPER="$helper"
          python - <<'PY'
          import os,pathlib
          p=pathlib.Path('supabase/functions')/os.environ['E2E_HELPER']/'index.ts'
          p.write_text(p.read_text().replace('TOKEN_PLACEHOLDER',os.environ['E2E_TOKEN']).replace('RUN_PLACEHOLDER',os.environ['GITHUB_RUN_ID']))
          PY
          supabase functions deploy "$helper" --project-ref "$SUPABASE_PROJECT_REF" --use-api --no-verify-jwt
          echo "HELPER_DEPLOYED=true" >> "$GITHUB_ENV"
      - name: Plan once, generate once, verify playback bytes and two credits
        shell: bash
        run: |
          set -euo pipefail
          base="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1"
          helper_url="$base/$HELPER_NAME"
          session="$(curl --fail-with-body --silent --show-error --max-time 40 -H "x-test-key: $HELPER_TOKEN" -H 'content-type: application/json' --data '{"action":"create"}' "$helper_url")"
          user_id="$(jq -er '.user_id' <<<"$session")"
          access_token="$(jq -er '.access_token' <<<"$session")"
          echo "::add-mask::$access_token"
          echo "TEST_USER_ID=$user_id" >> "$GITHUB_ENV"
          call() {
            local response code
            response="$(mktemp)"
            code="$(curl --silent --show-error --max-time 100 -o "$response" -w '%{http_code}' -H "Authorization: Bearer $access_token" -H 'content-type: application/json' --data "$2" "$base/$1")"
            if [[ "$code" != 2* ]]; then echo "Endpoint $1 failed HTTP $code" >&2; jq '{code,message}' "$response" >&2; rm "$response"; return 1; fi
            cat "$response"; rm "$response"
          }
          plan_id="$(cat /proc/sys/kernel/random/uuid)"
          plan_body="$(jq -n --arg id "$plan_id" '{purpose:"brain",message:"Crea un video de cinco segundos de un amanecer sobre montañas verdes, con nubes moviéndose y un movimiento suave de cámara. Añade una narración corta: Dios va delante de ti. Sin música ni subtítulos.",language:"es",idempotency_key:$id}')"
          planned="$(call chat "$plan_body")"
          jq -e '.plan.action=="video" and .credits_remaining==1' <<<"$planned" >/dev/null
          replayed="$(call chat "$plan_body")"
          test "$(jq -cS '.plan' <<<"$planned")" = "$(jq -cS '.plan' <<<"$replayed")"
          create_id="$(cat /proc/sys/kernel/random/uuid)"
          start_body="$(jq -n --argjson plan "$(jq '.plan' <<<"$planned")" --arg id "$create_id" '{prompt:$plan.prompt,narration:$plan.narration,voice:"nova",duration:5,idempotency_key:$id}')"
          started="$(call video-start "$start_body")"
          job_id="$(jq -er '.job_id' <<<"$started")"
          replay_start="$(call video-start "$start_body")"
          test "$job_id" = "$(jq -er '.job_id' <<<"$replay_start")"
          completed=""
          for attempt in $(seq 1 65); do
            status="$(call video-status "$(jq -n --arg id "$job_id" '{job_id:$id}')")"
            state="$(jq -er '.status' <<<"$status")"
            if [[ "$state" == completed ]]; then completed="$status"; break; fi
            if [[ "$state" == failed ]]; then echo 'Real provider pipeline failed.'; exit 1; fi
            sleep 8
          done
          test -n "$completed"
          mkdir -p acceptance
          verification="$(curl --fail --silent --show-error --max-time 40 -H "x-test-key: $HELPER_TOKEN" -H 'content-type: application/json' --data "$(jq -n --arg id "$user_id" '{action:"verify",user_id:$id}')" "$helper_url")"
          jq -e '.account.free_credits_total==5 and .account.free_credits_used==5 and (.events|length)==2 and all(.events[];.status=="succeeded" and .credits_charged==1)' <<<"$verification" >/dev/null
          jq '{account,events}' <<<"$verification" > acceptance/billing.json
          video_url="$(jq -er '.video_url' <<<"$completed")"
          curl --fail --silent --show-error --max-time 90 --location "$video_url" --output acceptance/video.mp4
          if ! command -v ffprobe >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg; fi
          ffprobe -v error -show_streams -show_format -of json acceptance/video.mp4 > acceptance/media.json
          jq -e '([.streams[]|select(.codec_type=="video")]|length)==1 and ([.streams[]|select(.codec_type=="audio")]|length)>=1 and (.format.duration|tonumber)>=4.9 and (.format.duration|tonumber)<=5.2' acceptance/media.json >/dev/null
          ffmpeg -v error -i acceptance/video.mp4 -an -f framemd5 acceptance/frames.md5
          python - <<'PY'
          import pathlib
          hashes=[line.rsplit(',',1)[-1].strip() for line in pathlib.Path('acceptance/frames.md5').read_text().splitlines() if line and not line.startswith('#')]
          assert len(hashes)>20 and len(set(hashes))>10,'Video is static or undecodable'
          PY
          ffmpeg -v error -i acceptance/video.mp4 -vf "fps=2,scale=160:90,tblend=all_mode=difference,signalstats,metadata=print:file=acceptance/motion.txt" -an -f null -
          python - <<'PY'
          import pathlib
          values=[float(line.split('=',1)[1]) for line in pathlib.Path('acceptance/motion.txt').read_text().splitlines() if line.startswith('lavfi.signalstats.YAVG=')]
          assert len(values)>=8 and sum(value>0.5 for value in values)>=0.8*len(values),'No continuous perceptible frame motion'
          PY
          ffmpeg -hide_banner -i acceptance/video.mp4 -af volumedetect -vn -f null - 2> acceptance/audio.txt
          python - <<'PY'
          import pathlib,re
          v=re.search(r'max_volume: (-?inf|-?[0-9.]+) dB',pathlib.Path('acceptance/audio.txt').read_text())
          assert v and float(v.group(1))>-50,'Missing or silent narration'
          PY
          jq '{plan:.plan}' <<<"$planned" > acceptance/plan.json
          printf '%s\n' 'PASS: actual planning, cached replay, one video, moving frames, non-silent audio, complete download, exactly two credits.' > acceptance/result.txt
          cat acceptance/result.txt
      - name: Remove technical user
        if: always()
        shell: bash
        run: |
          if [[ -n "${TEST_USER_ID:-}" ]]; then
            curl --fail --silent --show-error --max-time 45 -H "x-test-key: $HELPER_TOKEN" -H 'content-type: application/json' --data "$(jq -n --arg id "$TEST_USER_ID" '{action:"cleanup",user_id:$id}')" "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/$HELPER_NAME" | jq -e '.cleaned==true'
          fi
      - name: Remove temporary helper
        if: always()
        shell: bash
        run: |
          if [[ "${HELPER_DEPLOYED:-}" == true ]]; then
            curl --fail --silent --show-error --max-time 45 --request DELETE -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/functions/$HELPER_NAME" >/dev/null
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authorized-brain-acceptance
          path: acceptance/
          retention-days: 7
