name: Verify repaired real sample without provider calls
on:
  push:
    branches: [architecture/supabase-edge-video]
    paths: [.github/workflows/video-e2e-once.yml]
permissions:
  contents: read
  actions: read
jobs:
  verify-existing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: existing-video-composition-acceptance
          run-id: 38607895496
          github-token: ${{ github.token }}
          path: acceptance
      - name: Install decoder
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Verify full duration, motion and unrepeated narration
        shell: bash
        run: |
          set -euo pipefail
          ffprobe -v error -show_streams -show_format -of json acceptance/video.mp4 > acceptance/media.json
          jq -e '([.streams[]|select(.codec_type=="video")]|length)==1 and ([.streams[]|select(.codec_type=="audio")]|length)>=1 and (.format.duration|tonumber)>=4.9 and (.format.duration|tonumber)<=5.2' acceptance/media.json >/dev/null
          ffmpeg -v error -i acceptance/video.mp4 -vf 'fps=2,scale=160:90,tblend=all_mode=difference,signalstats,metadata=print:file=acceptance/motion.txt' -an -f null -
          python - <<'PY'
          import pathlib
          values=[float(line.split('=',1)[1]) for line in pathlib.Path('acceptance/motion.txt').read_text().splitlines() if line.startswith('lavfi.signalstats.YAVG=')]
          assert len(values)>=8 and min(values)>0.5,'Motion must continue across the whole video'
          PY
          ffmpeg -hide_banner -i acceptance/video.mp4 -af volumedetect -vn -f null - 2> acceptance/audio.txt
          python - <<'PY'
          import pathlib,re
          value=re.search(r'max_volume: (-?inf|-?[0-9.]+) dB',pathlib.Path('acceptance/audio.txt').read_text())
          assert value and float(value.group(1))>-50,'Narration is missing or silent'
          PY
          ffmpeg -hide_banner -i acceptance/video.mp4 -af "apad=whole_dur=5,atrim=start=3:end=5,asetpts=PTS-STARTPTS,volumedetect" -vn -f null - 2> acceptance/tail-audio.txt
          python - <<'PY'
          import pathlib,re
          s=pathlib.Path('acceptance/tail-audio.txt').read_text()
          value=re.search(r'max_volume: (-?inf|-?[0-9.]+) dB',s)
          assert value and float(value.group(1)) < -50,'Short narration was repeated instead of ending'
          PY
          printf '%s\n' 'PASS: existing real AI scene and narration reused, five seconds, continuous visual motion, short speech ends without looping, complete MP4 decoded.' > acceptance/result.txt
          cat acceptance/result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: existing-video-composition-acceptance
          path: acceptance/
          retention-days: 7
